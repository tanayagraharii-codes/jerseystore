<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout cancelled — Matchday Kits</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .confirm-wrap { max-width: 520px; margin: 80px auto; text-align: center; padding: 0 24px; }
  .confirm-wrap h1 { font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: 32px; }
  .confirm-wrap p { color: #B9C9C0; }
  .confirm-wrap a { color: var(--gold); }
</style>
</head>
<body>
<header class="site"><div class="bar"><a href="/" class="wordmark">MATCHDAY<span>KITS</span></a></div></header>
<div class="confirm-wrap">
  <h1>Checkout cancelled</h1>
  <p>No payment was taken. Your cart items were not removed from stock.</p>
  <p><a href="/">Back to shop</a></p>
</div>
<script>
  const orderId = new URLSearchParams(window.location.search).get('order');
  if (orderId) {
    fetch('/api/checkout/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId })
    });
  }
</script>
</body>
</html>
